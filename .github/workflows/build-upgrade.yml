name: Build MindfulEBook 1.1 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          cat buildsrc/chunk_*.b64 > MindfulEBook_v1.1.0_Android_Source.zip.b64
          base64 -d MindfulEBook_v1.1.0_Android_Source.zip.b64 > MindfulEBook_v1.1.0_Android_Source.zip
          echo "60244e1017d777618742ee665aebf388f0bea75fac3ec80c29bde3b6f075073f  MindfulEBook_v1.1.0_Android_Source.zip" | sha256sum -c -
          unzip -q MindfulEBook_v1.1.0_Android_Source.zip -d buildsrc/unpacked

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: buildsrc/unpacked/MindfulEBook_v1_1
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        working-directory: buildsrc/unpacked/MindfulEBook_v1_1
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MindfulEBook-1.1.0-APK
          path: buildsrc/unpacked/MindfulEBook_v1_1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
