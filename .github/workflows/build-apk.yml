name: Build MindfulEBook 1.1 APK

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source_parts/part* > source.b64
          base64 -d source.b64 > MindfulEBook_v1.1.0_Android_Source.zip
          echo "60244e1017d777618742ee665aebf388f0bea75fac3ec80c29bde3b6f075073f  MindfulEBook_v1.1.0_Android_Source.zip" | sha256sum -c -
          unzip -q MindfulEBook_v1.1.0_Android_Source.zip

      - name: Build debug APK
        working-directory: MindfulEBook_v1_1
        run: gradle --no-daemon :app:assembleDebug

      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          cp MindfulEBook_v1_1/app/build/outputs/apk/debug/app-debug.apk MindfulEBook-1.1.0.apk
          sha256sum MindfulEBook-1.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MindfulEBook-1.1.0-APK
          path: MindfulEBook-1.1.0.apk
          if-no-files-found: error
